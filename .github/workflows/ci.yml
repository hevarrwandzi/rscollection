name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate app and Docker config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check index.js

      - name: Check frontend syntax
        run: node --check public/app.js

      - name: Create CI env file
        run: cp .env.example .env

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Docker images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for stack health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/health | grep -q '"status":"ok"'; then
              echo "Stack is healthy"
              exit 0
            fi
            echo "Waiting for stack..."
            docker compose ps
            sleep 3
          done

          echo "Stack did not become healthy"
          docker compose logs
          exit 1

      - name: Check products API
        run: |
          curl -fsS http://localhost:8080/products | grep -q "Crown Charm Chain"

      - name: Stop stack
        if: always()
        run: docker compose down -v
